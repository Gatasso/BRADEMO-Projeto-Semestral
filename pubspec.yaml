name: brademo_projeto_final
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  image_picker: ^1.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  http: ^1.6.0
  flutter_local_notifications: ^17.0.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  hive_ce: ^2.19.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "yes"
  ios: "yes"
  image_path: "assets/images/logo_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_launcher.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/data/
